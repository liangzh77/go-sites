<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生信息采集登记表</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #e9e9e9; }
    body { margin: 0; color: #222; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    .page { width: 794px; margin: 24px auto; padding: 0 7px; background: #fff; }
    h1 { margin: 0; height: 55px; background: #3079b9; color: #fff; font-size: 32px; font-weight: 700; line-height: 55px; text-align: center; }
    .metadata { display: flex; height: 33px; align-items: center; font-size: 18px; padding: 0 5px; }
    .metadata .date { width: 66%; }
    .metadata [contenteditable] { display: inline-block; min-width: 180px; vertical-align: middle; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1px solid #79b8e4; }
    th, td { height: 31px; padding: 2px 4px; border: 1px dashed #79b8e4; font-size: 17px; font-weight: 400; line-height: 1.35; text-align: center; vertical-align: middle; overflow-wrap: anywhere; }
    .blue > td, .blue > th, .blue-cell { background: #dfedf8; }
    .left { text-align: left; }
    .transport { height: 72px; }
    .learning { height: 94px; }
    .other { height: 88px; }
    .remarks { height: 61px; }
    .choices { white-space: nowrap; }
    .choices label { display: inline-flex; gap: 3px; align-items: center; margin-right: 9px; cursor: pointer; }
    .choices label:last-child { margin-right: 0; }
    input[type="radio"] { width: 13px; height: 13px; margin: 0; accent-color: #3079b9; cursor: pointer; }
    .transport .choices { white-space: normal; }
    .transport .choices label { margin-right: 5px; }
    [contenteditable="true"] { cursor: text; white-space: pre-wrap; text-align: left; }
    [contenteditable="true"]:focus { outline: 2px solid #3079b9; outline-offset: -2px; background: #f4faff; }
    @media (max-width: 820px) { html { background: #fff; } .page { margin: 0; } body { overflow-x: auto; } }
    @page { size: A4 portrait; margin: 0; }
    @media print {
      html, body { margin: 0; background: #fff; }
      .page { width: 210mm; margin: 0; padding: 0 1.85mm; }
      h1, th, td { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      [contenteditable="true"]:focus { outline: none; background: transparent; }
      tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="学生信息采集登记表">
    <h1>学生信息采集登记表</h1>
    <div class="metadata">
      <div class="date">登记日期：<span contenteditable="true" role="textbox" aria-label="登记日期"></span></div>
      <div>编号：<span contenteditable="true" role="textbox" aria-label="编号" style="min-width:140px"></span></div>
    </div>
    <table aria-label="学生信息采集登记表填写区域">
      <colgroup><col style="width:13.74%"><col style="width:9.95%"><col style="width:10.85%"><col style="width:14.1%"><col style="width:15.19%"><col style="width:12.48%"><col style="width:9.95%"><col style="width:13.74%"></colgroup>
      <tbody>
        <tr><th scope="row">姓名</th><td contenteditable="true" role="textbox" aria-label="姓名"></td><th scope="row">性别</th><td contenteditable="true" role="textbox" aria-label="性别"></td><th scope="row">出生年月</th><td contenteditable="true" role="textbox" aria-label="出生年月"></td><th scope="row">年龄</th><td contenteditable="true" role="textbox" aria-label="年龄"></td></tr>
        <tr class="blue"><th scope="row">民族</th><td contenteditable="true" role="textbox" aria-label="民族"></td><th scope="row">籍贯</th><td contenteditable="true" role="textbox" aria-label="籍贯"></td><th scope="row">政治面貌</th><td contenteditable="true" role="textbox" aria-label="政治面貌"></td><th scope="row">学号</th><td contenteditable="true" role="textbox" aria-label="学号"></td></tr>
        <tr><th scope="row">身份证号</th><td colspan="7" contenteditable="true" role="textbox" aria-label="身份证号"></td></tr>
        <tr class="blue"><th scope="row">是否独子</th><td colspan="3" class="choices"><label><input type="radio" name="only-child" value="是">是</label><label><input type="radio" name="only-child" value="否">否</label></td><th scope="row">学生类别</th><td colspan="3" class="choices"><label><input type="radio" name="student-type" value="普通学生">普通学生</label><label><input type="radio" name="student-type" value="随班就读学生">随班就读学生</label></td></tr>
        <tr><th scope="row">特殊家庭</th><td colspan="3" class="choices"><label><input type="radio" name="special-family" value="是">是</label><label><input type="radio" name="special-family" value="否">否</label></td><th scope="row">是否残疾</th><td colspan="3" class="choices"><label><input type="radio" name="disability" value="是">是</label><label><input type="radio" name="disability" value="否">否</label></td></tr>
        <tr class="blue"><th scope="row">参加学平险</th><td colspan="3" class="choices"><label><input type="radio" name="insurance" value="是">是</label><label><input type="radio" name="insurance" value="否">否</label></td><th scope="row">是否住宿生</th><td colspan="3" class="choices"><label><input type="radio" name="boarding" value="是">是</label><label><input type="radio" name="boarding" value="否">否</label></td></tr>
        <tr><th scope="row" colspan="2">户口所在地</th><td colspan="3" contenteditable="true" role="textbox" aria-label="户口所在地"></td><th scope="row">户籍性质</th><td colspan="2" class="choices"><label><input type="radio" name="household-type" value="城镇">城镇</label><label><input type="radio" name="household-type" value="农村">农村</label></td></tr>
        <tr class="blue"><th scope="row">现居地址</th><td colspan="3" contenteditable="true" role="textbox" aria-label="现居地址"></td><th scope="row">家庭电话</th><td colspan="3" contenteditable="true" role="textbox" aria-label="家庭电话"></td></tr>

        <tr><th scope="rowgroup" rowspan="4">家庭成员<br>信息登记</th><th scope="col">姓名</th><th scope="col">称谓</th><th scope="col">年龄</th><th scope="col" colspan="2">工作单位</th><th scope="col">职业</th><th scope="col">联系电话</th></tr>
        <tr class="blue"><td contenteditable="true" role="textbox" aria-label="家庭成员1姓名"></td><td contenteditable="true" role="textbox" aria-label="家庭成员1称谓"></td><td contenteditable="true" role="textbox" aria-label="家庭成员1年龄"></td><td colspan="2" contenteditable="true" role="textbox" aria-label="家庭成员1工作单位"></td><td contenteditable="true" role="textbox" aria-label="家庭成员1职业"></td><td contenteditable="true" role="textbox" aria-label="家庭成员1联系电话"></td></tr>
        <tr><td contenteditable="true" role="textbox" aria-label="家庭成员2姓名"></td><td contenteditable="true" role="textbox" aria-label="家庭成员2称谓"></td><td contenteditable="true" role="textbox" aria-label="家庭成员2年龄"></td><td colspan="2" contenteditable="true" role="textbox" aria-label="家庭成员2工作单位"></td><td contenteditable="true" role="textbox" aria-label="家庭成员2职业"></td><td contenteditable="true" role="textbox" aria-label="家庭成员2联系电话"></td></tr>
        <tr class="blue"><td contenteditable="true" role="textbox" aria-label="家庭成员3姓名"></td><td contenteditable="true" role="textbox" aria-label="家庭成员3称谓"></td><td contenteditable="true" role="textbox" aria-label="家庭成员3年龄"></td><td colspan="2" contenteditable="true" role="textbox" aria-label="家庭成员3工作单位"></td><td contenteditable="true" role="textbox" aria-label="家庭成员3职业"></td><td contenteditable="true" role="textbox" aria-label="家庭成员3联系电话"></td></tr>
        <tr><th scope="row">紧急联系人</th><th scope="row">称谓</th><td contenteditable="true" role="textbox" aria-label="紧急联系人称谓"></td><th scope="row">姓名</th><td contenteditable="true" role="textbox" aria-label="紧急联系人姓名"></td><th scope="row">联系方式</th><td colspan="2" contenteditable="true" role="textbox" aria-label="紧急联系人联系方式"></td></tr>

        <tr><th scope="rowgroup" rowspan="4" class="blue-cell">曾就读<br>学校信息</th><th scope="col" colspan="2">起止年月</th><th scope="col" colspan="2">学校名称</th><th scope="col">证明人</th><th scope="col" colspan="2">联系电话</th></tr>
        <tr class="blue"><td colspan="2" contenteditable="true" role="textbox" aria-label="曾就读学校1起止年月"></td><td colspan="2" contenteditable="true" role="textbox" aria-label="曾就读学校1名称"></td><td contenteditable="true" role="textbox" aria-label="曾就读学校1证明人"></td><td colspan="2" contenteditable="true" role="textbox" aria-label="曾就读学校1联系电话"></td></tr>
        <tr><td colspan="2" contenteditable="true" role="textbox" aria-label="曾就读学校2起止年月"></td><td colspan="2" contenteditable="true" role="textbox" aria-label="曾就读学校2名称"></td><td contenteditable="true" role="textbox" aria-label="曾就读学校2证明人"></td><td colspan="2" contenteditable="true" role="textbox" aria-label="曾就读学校2联系电话"></td></tr>
        <tr class="blue"><td colspan="2" contenteditable="true" role="textbox" aria-label="曾就读学校3起止年月"></td><td colspan="2" contenteditable="true" role="textbox" aria-label="曾就读学校3名称"></td><td contenteditable="true" role="textbox" aria-label="曾就读学校3证明人"></td><td colspan="2" contenteditable="true" role="textbox" aria-label="曾就读学校3联系电话"></td></tr>
        <tr><th scope="row">现就读班级</th><td colspan="2" contenteditable="true" role="textbox" aria-label="现就读班级"></td><th scope="row">入学年月</th><td colspan="2" contenteditable="true" role="textbox" aria-label="入学年月"></td><th scope="row">班主任</th><td contenteditable="true" role="textbox" aria-label="班主任"></td></tr>
        <tr class="blue"><th scope="row">健康状况</th><td colspan="3" class="choices"><label><input type="radio" name="health" value="健康">健康</label><label><input type="radio" name="health" value="良好">良好</label><label><input type="radio" name="health" value="差">差</label></td><th scope="row">疾病史</th><td colspan="3" contenteditable="true" role="textbox" aria-label="疾病史"></td></tr>
        <tr class="blue"><th scope="row">过敏史</th><td colspan="3" contenteditable="true" role="textbox" aria-label="过敏史"></td><th scope="row">家族史</th><td colspan="3" contenteditable="true" role="textbox" aria-label="家族史"></td></tr>
        <tr><th scope="row" colspan="3">是否有不适于运动的疾病</th><td class="choices"><label><input type="radio" name="sports-condition" value="是">是</label><label><input type="radio" name="sports-condition" value="否">否</label></td><th scope="row" colspan="2">具体疾病描述</th><td colspan="2" contenteditable="true" role="textbox" aria-label="具体疾病描述"></td></tr>
        <tr class="blue"><th scope="rowgroup" rowspan="2">兴趣爱好</th><td colspan="3" contenteditable="true" role="textbox" aria-label="兴趣爱好第一行"></td><th scope="rowgroup" rowspan="2">个人特长</th><td colspan="3" contenteditable="true" role="textbox" aria-label="个人特长第一行"></td></tr>
        <tr><td colspan="3" contenteditable="true" role="textbox" aria-label="兴趣爱好第二行"></td><td colspan="3" contenteditable="true" role="textbox" aria-label="个人特长第二行"></td></tr>
        <tr class="transport"><th scope="row">经常<br>接送人</th><td colspan="3" contenteditable="true" role="textbox" aria-multiline="true" aria-label="经常接送人"></td><th scope="row">经常接送<br>方式</th><td colspan="3" class="left choices"><label><input type="radio" name="transport" value="私家车">私家车</label><label><input type="radio" name="transport" value="电动车">电动车</label><br><label><input type="radio" name="transport" value="自行车">自行车</label><label><input type="radio" name="transport" value="步行">步行</label><label><input type="radio" name="transport" value="其它">其它</label></td></tr>
        <tr class="blue learning"><th scope="row">学生目前<br>学习情况</th><td colspan="3" contenteditable="true" role="textbox" aria-multiline="true" aria-label="学生目前学习情况"></td><th scope="row">个人奖惩<br>情况</th><td colspan="3" contenteditable="true" role="textbox" aria-multiline="true" aria-label="个人奖惩情况"></td></tr>
        <tr class="other"><th scope="row">其他特殊<br>情况记录</th><td colspan="7" contenteditable="true" role="textbox" aria-multiline="true" aria-label="其他特殊情况记录"></td></tr>
        <tr class="blue remarks"><th scope="row">备注</th><td colspan="7" contenteditable="true" role="textbox" aria-multiline="true" aria-label="备注"></td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
